name: Build APK

on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Standard GitHub-hosted runner: free and unlimited for public repositories.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SAKU_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/saku.jks"
            echo "SAKU_KEYSTORE_FILE=$RUNNER_TEMP/saku.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          SAKU_KEYSTORE_PASSWORD: ${{ secrets.SAKU_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk SakuDeck.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SakuDeck-${{ github.run_number }}
          path: SakuDeck.apk
          retention-days: 30

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SakuDeck.apk \
            --target "$GITHUB_SHA" \
            --title "Saku Deck build #${{ github.run_number }}" \
            --notes "Versi terbaru Saku Deck (build #${{ github.run_number }}). Unduh SakuDeck.apk lalu pasang di HP."
