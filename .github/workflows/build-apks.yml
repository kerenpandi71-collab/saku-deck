name: Build Liquid Glass icon packs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: |
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          CMDLINE_TOOLS=$(find "$SDK/cmdline-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)
          echo "$SDK/cmdline-tools/$CMDLINE_TOOLS/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/$CMDLINE_TOOLS/bin/sdkmanager" --licenses
          "$SDK/cmdline-tools/$CMDLINE_TOOLS/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate icon catalog and resources
        run: python3 tools/validate_pack.py
      - name: Build both icon pack variants
        run: ./gradlew --no-daemon :app:assembleLightDebug :app:assembleDarkDebug
      - uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-light-apk
          path: app/build/outputs/apk/light/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-dark-apk
          path: app/build/outputs/apk/dark/debug/*.apk
          if-no-files-found: error
